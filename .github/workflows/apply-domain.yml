name: Apply ski domain change
on:
  push:
    branches: [canonical-ski-domain]
    paths: ['.github/workflows/apply-domain.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit files
        run: |
          sed -i 's#^\(\s*\)const API_BASE = .*#\1const API_BASE = "/api/blocks";#' index.html
          sed -i "s#^\(\s*\)const ORDERS_API = .*#\1const ORDERS_API = '/api/orders';#" index.html
          sed -i 's#https://skirent-ten.vercel.app#https://ski.surfrent-il.com#g' index.html robots.txt sitemap.xml
          cat > vercel.json <<'JSON'
          {
            "redirects": [
              {
                "source": "/((?!api/).*)",
                "has": [{ "type": "host", "value": "skirent-ten.vercel.app" }],
                "destination": "https://ski.surfrent-il.com/$1",
                "permanent": true
              }
            ]
          }
          JSON
          grep -n 'skirent-ten\|API_BASE =\|ORDERS_API =' index.html robots.txt sitemap.xml || true
      - name: Commit
        run: |
          git config user.name "instinct"
          git config user.email "noreply@github.com"
          git add index.html robots.txt sitemap.xml vercel.json
          git commit -m "Use ski.surfrent-il.com as the only domain: canonical, og, sitemap, robots, relative API, 308 redirect from old vercel domain"
          git push
