name: Apply helmets nov15 final (one-shot, self-deleting)
on:
  push:
    branches: [helmets-nov15]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helmets-nov15
      - name: Download payload, apply, clean up
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/hiH7N > part0
          curl -fsSL https://paste.rs/z5wSG > part1
          cat part0 part1 > index.html
          curl -fsSL -o images/helmet-gray-1.jpg https://paste.rs/B0qY3
          curl -fsSL -o images/helmet-gray-1.webp https://paste.rs/8cnV6
          curl -fsSL -o images/helmet-black-1.jpg https://paste.rs/kFWj6
          curl -fsSL -o images/helmet-black-1.webp https://paste.rs/JOHGr
          test "$(wc -c < index.html)" -eq 148742
          grep -q 'helmet-gray-1.webp' index.html
          test "$(wc -c < images/helmet-gray-1.webp)" -eq 12334
          test "$(wc -c < images/helmet-black-1.webp)" -eq 12498
          git rm -rq .github
          git config user.name "yishayullman"
          git config user.email "yishay.ullman@gmail.com"
          git add index.html images/
          git commit -m "Add 5 new helmets: 4 gray adult + 1 black kids, one-size truthful sizing"
          git push origin helmets-nov15
