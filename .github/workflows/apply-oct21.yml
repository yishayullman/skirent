name: Apply audit improvements (one-shot, self-deleting)
on:
  push:
    branches: [audit-improvements-oct21]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-improvements-oct21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      - run: python scripts/apply_improvements.py
      - name: Commit results and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-oct21.yml scripts/apply_improvements.py
          rmdir scripts 2>/dev/null || true
          git add -A
          git commit -m "Apply audit improvements: booking journey, a11y, images, headers"
          git push
